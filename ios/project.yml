# Альтернатива готовому SoundField.xcodeproj: `brew install xcodegen && xcodegen` в папке ios/
name: SoundField
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
targets:
  SoundField:
    type: application
    platform: iOS
    sources:
      - path: SoundField
        excludes: ["Info.plist"]
    info:
      path: SoundField/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundfield
        INFOPLIST_FILE: SoundField/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 10
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
