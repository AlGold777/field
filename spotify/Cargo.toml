[package]
name = "sfspotify"
version = "0.1.2"
edition = "2021"
publish = false
description = "Spotify Connect receiver (librespot) with a JNI bridge for SoundField"

[lib]
name = "sfspotify"
crate-type = ["cdylib", "rlib"]

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Копия librespot-discovery 0.8.0 с одним патчем (Builder::without_zeroconf, Discovery::port): см. vendor/README.
librespot-discovery = { path = "vendor/librespot-discovery", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
jni = "0.21.1"

# На хосте mDNS отвечает libmdns (для проверки без Android); на Android службу объявляет Kotlin (NsdManager).
[target.'cfg(not(target_os = "android"))'.dependencies]
librespot-discovery = { path = "vendor/librespot-discovery", default-features = false, features = ["with-libmdns"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
